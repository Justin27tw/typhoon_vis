name: Auto Update Typhoon Map

on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分鐘排程執行一次
  workflow_dispatch:       # 允許手動點擊執行

jobs:
  update-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Python script
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python typhoon_vis.py

      - name: Commit and Push updated typhoon pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 【關鍵修改】把首頁、所有動態分頁、歷史索引、轉址設定全部加入 Git 追蹤
          git add index.html typhoonvis_*.html *.json README.md _redirects || true
          
          # 若有任何資料或分頁更新，自動 Commit 並 Push 觸發 Netlify 部署
          if ! git diff --staged --quiet; then
            git commit -m "Auto update typhoon map and active cyclone pages"
            git pull --rebase origin main
            git push origin main
          else
            echo "目前無新數據變動，略過推送。"
          fi
