name: Auto Update Typhoon Map

on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分鐘排程執行一次
  workflow_dispatch:       # 允許手動點擊執行

jobs:
  update-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Python script
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          python typhoon_vis.py
          cp index.html typhoonvis_CHAMPI.html  # 新增這行：把產生好的完整地圖複製一份命名為薔琵

      - name: Commit and Push index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html typhoonvis_CHAMPI.html  # 新增追蹤 typhoonvis_CHAMPI.html
          git commit -m "Auto update typhoon map and save CHAMPI history" || exit 0
          git push